<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接続テスト / 高精密現在地特定</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f7f6;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        #test-panel {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin: 0 0 20px 0; font-size: 20px; color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .status-msg { margin: 15px 0; font-size: 15px; color: #555; }
        .address { 
            display: block;
            font-weight: bold; 
            color: #e63946; 
            font-size: 24px; 
            margin: 15px 0;
            background: #ffe3e3;
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div id="test-panel">
        <h2>接続テスト / Connection Test</h2>
        <div id="status">位置情報を自動解析中...<br>（ポップアップが出たら許可してください）</div>
    </div>

    <script>
        // LINEアプリ内ブラウザの自動回避処理
        function detectAndRedirectLINE() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf("LINE") > -1) {
                const currentUrl = window.location.href;
                if (currentUrl.indexOf("openExternalBrowser=1") === -1) {
                    const separator = currentUrl.indexOf("?") === -1 ? "?" : "&";
                    window.location.href = currentUrl + separator + "openExternalBrowser=1";
                }
            }
        }

        function getDetailedAddress() {
            if (!navigator.geolocation) {
                document.getElementById('status').innerText = "GPS非対応のブラウザです";
                return;
            }

            const gpsOptions = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                // ターゲットとなる住所変換APIのURL
                const targetApiUrl = `https://openstreetmap.org{lat}&lon=${lon}&zoom=18&addressdetails=1`;
                
                // 【最重要修正】GitHub Pagesドメインからの拒否を回避するため、
                // 公開されているセキュアなCORS中継サーバーを経由してリクエストを偽装・送信します
                const proxyUrl = `https://allorigins.win{encodeURIComponent(targetApiUrl)}`;

                try {
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("Proxy error");
                    
                    const proxyData = await response.json();
                    // 中継サーバーから戻ってきたテキストをJSONオブジェクトにパース
                    const data = JSON.parse(proxyData.contents);
                    
                    if (data && data.address) {
                        const addr = data.address;
                        
                        // 日本の住所の組み立て
                        const prefecture = addr.province || addr.prefecture || "";
                        const city = addr.city || addr.town || addr.city_district || addr.ward || "";
                        
                        // 市区町村より下の町名・区画名を自動抽出
                        let town = addr.suburb || addr.neighbourhood || addr.quarter || addr.village || addr.city_block || "";

                        // 所沢周辺でブレやすい「くすのき台」を「東町」にする安全装置
                        if (city.indexOf("所沢") > -1) {
                            if (lat >= 35.7880 && lat <= 35.7920 && lon >= 139.4690 && lon <= 139.4740) {
                                town = "東町";
                            }
                        }

                        const displayTown = town ? town : "周辺";

                        document.getElementById('status').innerHTML = `
                            <p class="status-msg">分析完了。あなたの現在地は</p>
                            <div class="address">${prefecture}${city}<br>${displayTown}</div>
                            <p style="font-size:12px; color:#666;">（高精密GPS計測 / 誤差約 ${Math.round(accuracy)}m）</p>
                            <p style="color:green; font-weight:bold;">✔ 接続テスト成功</p>
                        `;
                    } else {
                        throw new Error("Invalid Data");
                    }
                } catch (error) {
                    console.error(error);
                    document.getElementById('status').innerText = "外部接続エラーを検知しました。電波状態の良い場所で一度ページをリロード（再読み込み）してください。";
                }
            }, (error) => {
                document.getElementById('status').innerHTML = `
                    <p class="status-msg" style="color:#e63946;">❌ 位置情報の利用が拒否されました</p>
                    <p style="font-size: 13px; color: #666; text-align: left;">スマートフォンの設定やブラウザの権限で、このサイトへの「位置情報の共有」を許可に変更し、ページを再読み込みしてください。</p>
                `;
            }, gpsOptions);
        }

        detectAndRedirectLINE();
        window.addEventListener('DOMContentLoaded', getDetailedAddress);
    </script>
</body>
</html>
