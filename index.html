<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接続テスト / 高精密現在地特定</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f7f6;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        #test-panel {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin: 0 0 20px 0; font-size: 20px; color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .status-msg { margin: 15px 0; font-size: 15px; color: #555; }
        .address { 
            display: block;
            font-weight: bold; 
            color: #e63946; 
            font-size: 24px; 
            margin: 15px 0;
            background: #ffe3e3;
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div id="test-panel">
        <h2>接続テスト / Connection Test</h2>
        <div id="status">位置情報を解析中...<br>（ポップアップが出たら許可してください）</div>
    </div>

    <script>
        // LINEアプリ内ブラウザの自動回避
        function detectAndRedirectLINE() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf("LINE") > -1) {
                const currentUrl = window.location.href;
                if (currentUrl.indexOf("openExternalBrowser=1") === -1) {
                    const separator = currentUrl.indexOf("?") === -1 ? "?" : "&";
                    window.location.href = currentUrl + separator + "openExternalBrowser=1";
                }
            }
        }

        // 外部通信を一切行わない、所沢駅周辺の詳細座標マスター
        const AREA_MASTER = [
            { name: "埼玉県所沢市東町", lat: 35.7895, lon: 139.4715 }, // 東町の中心
            { name: "埼玉県所沢市くすのき台", lat: 35.7865, lon: 139.4770 },
            { name: "埼玉県所沢市日吉町", lat: 35.7869, lon: 139.4725 },
            { name: "埼玉県所沢市寿町", lat: 35.7925, lon: 139.4645 },
            { name: "埼玉県所沢市旭町", lat: 35.7955, lon: 139.4785 },
            { name: "埼玉県所沢市御幸町", lat: 35.7921, lon: 139.4681 }
        ];

        // 2点間の距離を計算する関数（メートル単位）
        function getDistance(lat1, lon1, lat2, lon2) {
            const x = (lon2 - lon1) * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
            const y = lat2 - lat1;
            return Math.sqrt(x * x + y * y) * 111319;
        }

        function getDetailedAddress() {
            if (!navigator.geolocation) {
                document.getElementById('status').innerText = "GPS非対応のブラウザです";
                return;
            }

            const gpsOptions = {
                enableHighAccuracy: true, // 最高精度GPSモードを強制
                timeout: 15000,
                maximumAge: 0             // キャッシュを破棄
            };

            navigator.geolocation.getCurrentPosition((position) => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                let detectedArea = "埼玉県所沢市周辺";
                let minDistance = Infinity;

                // 1. 各町の中心座標との距離を計算し、一番近い町を仮決定
                for (const area of AREA_MASTER) {
                    const dist = getDistance(userLat, userLon, area.lat, area.lon);
                    if (dist < minDistance) {
                        minDistance = dist;
                        detectedArea = area.name;
                    }
                }

                // 2. 【東町エリアの厳格な範囲補正】
                // 所沢駅の電波やWi-Fiのブレで「くすのき台」や「日吉町」にズレやすい「東町」の区画（緯度経度）を直接指定。
                // この範囲内に端末がいる場合は、最優先で「東町」と判定します。
                if (userLat >= 35.7880 && userLat <= 35.7920 && userLon >= 139.4690 && userLon <= 139.4740) {
                    detectedArea = "埼玉県所沢市東町";
                }

                // 表示用にテキストを綺麗に分割（7文字目の「市」の後ろで改行）
                const mainAddr = detectedArea.substring(0, 7); // 埼玉県所沢市
                const subAddr = detectedArea.substring(7);     // 東町、くすのき台 など

                document.getElementById('status').innerHTML = `
                    <p class="status-msg">分析完了。あなたの現在地は</p>
                    <div class="address">${mainAddr}<br>${subAddr}</div>
                    <p style="font-size:12px; color:#666;">（内蔵センサー計測 / 精度誤差: 約 ${Math.round(accuracy)}m）</p>
                    <p style="color:green; font-weight:bold;">✔ 接続テスト成功</p>
                `;

            }, (error) => {
                document.getElementById('status').innerText = "位置情報の利用が拒否されました。設定アプリからブラウザの位置情報権限を許可してください。";
            }, gpsOptions);
        }

        detectAndRedirectLINE();
        window.addEventListener('DOMContentLoaded', getDetailedAddress);
    </script>
</body>
</html>
