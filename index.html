
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高精度位置情報取得</title>
<style>
body {
  font-family: sans-serif;
  background: #f3f6f9;
  padding: 20px;
  text-align: center;
}
.card {
  max-width: 400px;
  margin: 30px auto;
  padding: 24px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 16px #0001;
}
button {
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
  background: #0066cc;
  color: white;
  font-size: 16px;
}
#result {
  overflow-wrap: anywhere;
  line-height: 1.8;
}
</style>
</head>
<body>

<div class="card">
  <h2>現在地測定</h2>
  <p id="status">ボタンを押して測定を開始</p>
  <div id="result"></div>
  <button id="start">測定開始</button>
</div>

<script>
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const startBtn = document.getElementById("start");

startBtn.addEventListener("click", locate);

function locate() {
  if (!navigator.geolocation) {
    statusEl.textContent = "位置情報に対応していません";
    return;
  }

  startBtn.disabled = true;
  resultEl.replaceChildren();
  statusEl.textContent = "高精度で測位中...";

  let best = null;
  let watchId = null;
  let finished = false;

  const finish = async () => {
    if (finished) return;
    finished = true;

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
    }

    if (!best) {
      statusEl.textContent = "位置情報を取得できませんでした";
      startBtn.disabled = false;
      return;
    }

    const { latitude, longitude, accuracy } = best.coords;
    statusEl.textContent = "座標を取得。住所を検索中...";

    const coords = document.createElement("p");
    coords.textContent =
      `緯度: ${latitude}\n経度: ${longitude}\n推定誤差: 約${Math.round(accuracy)}m`;
    resultEl.appendChild(coords);

    try {
      const url = new URL(
        "https://nominatim.openstreetmap.org/reverse"
      );

      url.search = new URLSearchParams({
        format: "jsonv2",
        lat: latitude,
        lon: longitude,
        zoom: "18",
        addressdetails: "1",
        "accept-language": "ja"
      });

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("住所検索サービスが利用できません");
      }

      const data = await response.json();

      if (!data.address) {
        throw new Error("住所が見つかりません");
      }

      const a = data.address;
      const address = [
        a.state || a.province || a.prefecture,
        a.city || a.town || a.city_district || a.ward,
        a.suburb || a.neighbourhood || a.village || a.hamlet
      ].filter(Boolean).join("");

      const heading = document.createElement("h3");
      heading.textContent = "推定住所";
      resultEl.appendChild(heading);

      const addressEl = document.createElement("p");
      addressEl.textContent = address || data.display_name || "住所不明";
      resultEl.appendChild(addressEl);

      statusEl.textContent = "測位完了";
    } catch (error) {
      statusEl.textContent =
        "座標は取得済みですが、住所検索に失敗しました";
    } finally {
      startBtn.disabled = false;
    }
  };

  watchId = navigator.geolocation.watchPosition(
    position => {
      if (
        !best ||
        position.coords.accuracy < best.coords.accuracy
      ) {
        best = position;
      }

      statusEl.textContent =
        `測位中... 推定誤差 約${Math.round(
          best.coords.accuracy
        )}m`;

      if (position.coords.accuracy <= 15) {
        finish();
      }
    },
    error => {
      if (best) {
        finish();
        return;
      }

      const messages = {
        1: "位置情報の許可が必要です",
        2: "位置情報を取得できません",
        3: "測位がタイムアウトしました"
      };

      statusEl.textContent =
        messages[error.code] || "測位エラー";
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }
      startBtn.disabled = false;
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 30000
    }
  );

  // 30秒後に、取得できた中で最良の結果を採用
  setTimeout(finish, 30000);
}
</script>

</body>
</html>
