<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接続テスト / 高精密現在地特定</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f7f6;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        #test-panel {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin: 0 0 20px 0; font-size: 20px; color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .status-msg { margin: 15px 0; font-size: 15px; color: #555; }
        .address { 
            display: block;
            font-weight: bold; 
            color: #e63946; 
            font-size: 24px; 
            margin: 15px 0;
            background: #ffe3e3;
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div id="test-panel">
        <h2>接続テスト / Connection Test</h2>
        <div id="status">位置情報を自動解析中...<br>（ポップアップが出たら許可してください）</div>
    </div>

    <script>
        // LINEアプリ内ブラウザの自動回避
        function detectAndRedirectLINE() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf("LINE") > -1) {
                const currentUrl = window.location.href;
                if (currentUrl.indexOf("openExternalBrowser=1") === -1) {
                    const separator = currentUrl.indexOf("?") === -1 ? "?" : "&";
                    window.location.href = currentUrl + separator + "openExternalBrowser=1";
                }
            }
        }

        function getDetailedAddress() {
            if (!navigator.geolocation) {
                document.getElementById('status').innerText = "GPS非対応のブラウザです";
                return;
            }

            const gpsOptions = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    // 安全な暗号化サーバー（HTTPS）からのみ通信が許可される高精度住所変換API
                    const response = await fetch(`https://openstreetmap.org{lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data && data.address) {
                        const addr = data.address;
                        const prefecture = addr.province || addr.prefecture || "";
                        const city = addr.city || addr.town || addr.city_district || addr.ward || "";
                        const town = addr.suburb || addr.neighbourhood || addr.quarter || addr.village || addr.city_block || "";

                        document.getElementById('status').innerHTML = `
                            <p class="status-msg">分析完了。あなたの現在地は</p>
                            <div class="address">${prefecture}${city}<br>${town}</div>
                            <p style="color:green; font-weight:bold;">✔ 接続テスト成功</p>
                        `;
                    } else {
                        throw new Error("Invalid Data");
                    }
                } catch (error) {
                    document.getElementById('status').innerHTML = `
                        <p class="status-msg" style="color:#e63946;">❌ 通信ブロック検知</p>
                        <p style="font-size: 13px; text-align: left; color: #666;">ファイルを直接開いているため、ブラウザのセキュリティ機能が通信を強制遮断しました。このファイルを無料の公開サーバー（GitHub Pages等）にアップロードして、URLから開いてください。</p>
                    `;
                }
            }, (error) => {
                document.getElementById('status').innerText = "位置情報の利用が拒否されました。設定アプリから位置情報権限を許可してください。";
            }, gpsOptions);
        }

        detectAndRedirectLINE();
        window.addEventListener('DOMContentLoaded', getDetailedAddress);
    </script>
</body>
</html>
