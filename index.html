<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接続テスト / 高精密現在地特定</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f7f6;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        #test-panel {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin: 0 0 20px 0; font-size: 20px; color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .status-msg { margin: 15px 0; font-size: 15px; color: #555; }
        .address { 
            display: block;
            font-weight: bold; 
            color: #e63946; 
            font-size: 24px; 
            margin: 15px 0;
            background: #ffe3e3;
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div id="test-panel">
        <h2>接続テスト / Connection Test</h2>
        <div id="status">位置情報を解析中...<br>（ポップアップが出たら許可してください）</div>
    </div>

    <script>
        // --- 1. LINEのインappブラウザブロックを回避する処理 ---
        function detectAndRedirectLINE() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            // LINEアプリ内のブラウザであるかを検知
            if (ua.indexOf("LINE") > -1) {
                // 現在のURLを取得
                const currentUrl = window.location.href;
                
                // URLにパラメータを付与して、外部ブラウザ（Safari/Chrome）での強制起動を促す（LINEの仕様）
                if (currentUrl.indexOf("openExternalBrowser=1") === -1) {
                    const separator = currentUrl.indexOf("?") === -1 ? "?" : "&";
                    window.location.href = currentUrl + separator + "openExternalBrowser=1";
                }
            }
        }

        // --- 2. 限界まで最高精度に設定したGPS測位処理 ---
        function getDetailedAddress() {
            if (!navigator.geolocation) {
                document.getElementById('status').innerText = "GPS非対応のブラウザです";
                return;
            }

            // 【高精密オプションの厳格化】
            const gpsOptions = {
                enableHighAccuracy: true, // 必ず本物のGPSセンサーを起動（基地局推測を拒否）
                timeout: 15000,           // 精度が安定するまで最大15秒間計測を粘る
                maximumAge: 0             // 過去のキャッシュ位置データを完全に破棄し、今現在の生データを取得
            };

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy; // 判定誤差（メートル）

                try {
                    // 信頼性の高い住所変換APIへリクエスト
                    const response = await fetch(`https://openstreetmap.org{lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
                        }
                    });
                    
                    const data = await response.json();
                    if (!data || !data.address) throw new Error("No data");
                    
                    const addr = data.address;
                    const prefecture = addr.province || addr.prefecture || "";
                    const city = addr.city || addr.town || addr.city_district || addr.ward || "";
                    const town = addr.suburb || addr.neighbourhood || addr.quarter || addr.village || addr.city_block || "";

                    const displayTown = town ? town : "（町名データ取得不可）";

                    document.getElementById('status').innerHTML = `
                        <p class="status-msg">分析完了。あなたの現在地は</p>
                        <div class="address">${prefecture}${city}<br>${displayTown}</div>
                        <p style="font-size:12px; color:#666;">（GPS誤差: 約 ${Math.round(accuracy)} メートル）</p>
                        <p style="color:green; font-weight:bold;">✔ 接続テスト成功</p>
                    `;
                } catch (error) {
                    document.getElementById('status').innerText = "APIサーバー制限により住所変換が拒否されました。本物のHTTPSサーバー上で実行してください。";
                }
            }, (error) => {
                document.getElementById('status').innerText = "位置情報の利用が拒否されたか、GPS信号を受信できませんでした。ブラウザの設定で位置情報を「許可」にしてください。";
            }, gpsOptions);
        }

        // 実行トリガー
        detectAndRedirectLINE();
        window.addEventListener('DOMContentLoaded', getDetailedAddress);
    </script>
</body>
</html>
