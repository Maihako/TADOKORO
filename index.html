<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接続テスト / 高精密現在地特定</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f7f6;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        #test-panel {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin: 0 0 20px 0; font-size: 20px; color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .status-msg { margin: 15px 0; font-size: 15px; color: #555; }
        .address { 
            display: block;
            font-weight: bold; 
            color: #e63946; 
            font-size: 24px; 
            margin: 15px 0;
            background: #ffe3e3;
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div id="test-panel">
        <h2>接続テスト / Connection Test</h2>
        <div id="status">位置情報を自動解析中...<br>（ポップアップが出たら許可してください）</div>
    </div>

    <script>
        // LINEアプリ内ブラウザの自動回避
        function detectAndRedirectLINE() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf("LINE") > -1) {
                const currentUrl = window.location.href;
                if (currentUrl.indexOf("openExternalBrowser=1") === -1) {
                    const separator = currentUrl.indexOf("?") === -1 ? "?" : "&";
                    window.location.href = currentUrl + separator + "openExternalBrowser=1";
                }
            }
        }

        // 地図情報から自動で住所文字列を抽出するコールバック関数（JSONP）
        window.handleGeocodeResult = function(data) {
            const statusContent = document.getElementById('status');
            
            // APIから住所データが正しく戻ってきたかチェック
            if (data && data.coordinate && data.coordinate.address) {
                const fullAddress = data.coordinate.address; // 例: "埼玉県所沢市東町"
                
                // 表示用に「市」や「区」の後ろで綺麗に改行を入れる整形処理
                let formattedAddress = fullAddress;
                const cityIndex = fullAddress.indexOf("市");
                const wardIndex = fullAddress.indexOf("区");
                const targetIndex = cityIndex > -1 ? cityIndex : wardIndex;
                
                if (targetIndex > -1) {
                    formattedAddress = fullAddress.substring(0, targetIndex + 1) + "<br>" + fullAddress.substring(targetIndex + 1);
                }

                statusContent.innerHTML = `
                    <p class="status-msg">分析完了。あなたの現在地は</p>
                    <div class="address">${formattedAddress}</div>
                    <p style="color:green; font-weight:bold;">✔ 接続テスト成功</p>
                `;
            } else {
                statusContent.innerText = "自動住所変換に失敗しました。電波の良い場所で再試行してください。";
            }
        };

        function getDetailedAddress() {
            if (!navigator.geolocation) {
                document.getElementById('status').innerText = "GPS非対応のブラウザです";
                return;
            }

            const gpsOptions = {
                enableHighAccuracy: true, // 最高精度GPSモード
                timeout: 15000,
                maximumAge: 0             // キャッシュを破棄して今の位置を測る
            };

            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // スマホファイル内からでもセキュリティブロック（CORS）を受けないJSONP形式のスクリプトを動的生成
                // 登録・キー不要で緯度経度から日本の住所を自動逆引きしてくれるAPIを利用
                const script = document.createElement('script');
                script.src = `https://geocoding.jp{lat}&lon=${lon}&callback=handleGeocodeResult`;
                script.onerror = function() {
                    document.getElementById('status').innerText = "通信エラーが発生しました。インターネット接続を確認してください。";
                };
                
                document.body.appendChild(script);

            }, (error) => {
                document.getElementById('status').innerText = "位置情報の利用が拒否されました。設定アプリから位置情報権限を許可してください。";
            }, gpsOptions);
        }

        detectAndRedirectLINE();
        window.addEventListener('DOMContentLoaded', getDetailedAddress);
    </script>
</body>
</html>
